name: Archive revised Englotti B1 pilot results

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: englishlive-b1-r3-archive
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event.issue.number == 50 &&
      github.event.issue.user.login == 'addvaluewithai-hub' &&
      github.event.comment.user.login == 'addvaluewithai-hub' &&
      github.actor == 'addvaluewithai-hub' &&
      github.event.comment.body == 'archive-englishlive-b1-r3-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main-branch archiver
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Checkout existing results branch (preserve old pilot)
        uses: actions/checkout@v4
        with:
          ref: campaign/englishlive-b1-listening
          path: campaign
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pinned manifest and exact five delivered Actions artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAMPAIGN_CHECKOUT: campaign
        run: node control/src/archive-englishlive-pilot.mjs
      - name: Commit the ten exact files without touching Englotti or old results
        working-directory: campaign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/englishlive-b1-listening/results/
          if git diff --cached --quiet; then
            echo 'No new archive files; refusing empty/repeated run'
            exit 1
          fi
          git commit -m 'Archive revised Englotti B1 pilot results and word transcripts'
          git push origin HEAD:campaign/englishlive-b1-listening
