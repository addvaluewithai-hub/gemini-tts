*{box-sizing:border-box;margin:0}
#factbig,#factsmall,.chat .u,.chat .b,.chat .bar,.vs .t,.list h3,.list div,.rc h3,.rc span,.rc .c{unicode-bidi:plaintext}
#frame.rtl #cap,#frame.rtl #fact *,#frame.rtl #meme *,#frame.rtl #chipt,#frame.rtl #chips{letter-spacing:0}
#frame.rtl .rc{font-size:36px;line-height:1.5}#frame.rtl .list div{font-size:40px}#frame.rtl .chat .u{font-family:"Anton"}
/* layout "solo": no wall screen. The host is alone in his shots; anything shown fills the frame and he sits small at bottom right. */
#radar{display:none}#frame.solo #radar{display:block}
#frame.solo #tv,#frame.solo #lurk,#frame.solo #tvglow{display:none!important}
#frame.solo:not(.explain) #peek{display:none!important}
#board{inset:0}#board>svg{display:block}
#frame.solo #host{left:510px}
#frame.solo #win{left:0;top:0;width:1920px;height:1080px;border-radius:0;box-shadow:none}

#frame.solo #view{height:1080px}
#frame.solo #pan{width:1920px;height:1080px}
#frame.solo #view .textcard{font-size:27px}
#frame.solo #fact{left:360px;right:auto;top:250px;width:1000px}
#frame.solo #meme{left:400px;right:auto;top:140px}
#pip{left:1330px;top:626px;width:600px;height:600px;filter:drop-shadow(0 0 26px rgba(5,6,13,.75))}
#pipdesk{left:1300px;top:1010px;width:700px;height:90px;border-radius:26px 0 0 0;background:linear-gradient(#232859,#0d1028);border-top:6px solid #ff5fae;box-shadow:0 -6px 30px rgba(255,61,154,.45),0 0 40px rgba(5,6,13,.8)}
#pip svg{display:block}
/* layout "short": the solo set in a vertical frame. Cards sit above the host, captions between them. */
html.short,html.short body,#frame.short{width:1080px;height:1920px}
#frame.short #brand,#frame.short #lbT,#frame.short #lbB,#frame.short #insert,#frame.short #pip,#frame.short #pipdesk,#frame.short #scrim{display:none!important}

#frame.short #factbig{font-size:200px;white-space:normal;line-height:1.02}
#frame.short #fact.stamp #factbig{font-size:170px}
#frame.short #factsmall{font-size:46px;margin-top:30px}
#frame.short #meme{left:20px;right:20px;top:240px;width:auto;height:640px}
#frame.short .list{width:920px;padding:44px 50px 36px}#frame.short .list h3{font-size:70px}#frame.short .list div{font-size:52px}
#frame.short #cap{left:30px;right:30px;bottom:auto;font-size:82px}
#frame.short #chip{left:44px}#frame.short #chip div{font-size:72px}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060d}
#frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#05060d;font-family:"Anton";color:#fff}
#frame>*,#world>*{position:absolute}
#world{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#wall{left:-700px;top:-1500px;width:3320px;height:3080px}
#lurk{left:1280px;width:340px;height:340px}
#tv{left:1060px;top:170px;width:780px;height:439px;overflow:hidden;background:#0d1022;border-radius:6px;box-shadow:0 0 0 14px #08080e,0 0 0 16px #2c3052,0 30px 60px rgba(0,0,0,.55)}
#tv img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top;display:none}
#view img{position:absolute;left:0;top:0;width:100%;height:auto;display:none}
#tvident{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a3170,#0d1022);letter-spacing:.06em}
#tvident b{font-size:74px;font-weight:400}#tvident b i{font-style:normal;color:#ff4fa3}
#tvident span{font-family:"Elite";font-size:26px;color:#bfe9ff;margin-top:14px;letter-spacing:.12em}
.textcard{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7% 8%;background:#f3efe4;color:#17171b}
.textcard .who{font-family:"Anton";font-size:2.2em;letter-spacing:.08em;color:#c2182b}
.textcard .what{font-family:"Serif";font-size:5.2em;line-height:1.04;margin-top:.25em}
.textcard .when{font-family:"Elite";font-size:1.5em;margin-top:1.2em;color:#5b5648}
#tv .textcard{font-size:10px}#view .textcard{font-size:20px}
#tvglare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(120,200,255,.08) 100%)}
#live{position:absolute;right:14px;top:12px;font-size:20px;letter-spacing:.14em;background:#e5333f;padding:2px 10px 0;border-radius:4px}
#host{left:110px;top:70px;width:900px;height:900px}
#host svg,#lurk svg,#peek svg{display:block}
#drone{left:0;top:0;width:270px;height:136px}
#desk{left:-700px;top:600px;width:3320px;height:980px}
#scrim{inset:0;background:linear-gradient(90deg,rgba(5,6,13,0) 40%,rgba(5,6,13,.93) 60%)}
#insert{inset:0;background:radial-gradient(ellipse at 50% 35%,#1b2460,#070919 75%)}
#grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:96px 96px}
#win{position:absolute;left:240px;top:136px;width:1440px;height:866px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.12)}
#winbar{height:56px;background:#e6e8f0;display:flex;align-items:center;gap:10px;padding:0 20px;font-family:"Elite";color:#2b2e3f}
#winbar i{width:15px;height:15px;border-radius:50%;background:#ff5f57}#winbar i+i{background:#febc2e}#winbar i+i+i{background:#28c840}
#url{margin-left:18px;flex:1;height:34px;border-radius:17px;background:#fff;padding:7px 18px 0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#srcchip{font-family:"Anton";font-size:22px;letter-spacing:.08em;background:#17171b;color:#FFE66D;padding:6px 14px 3px;border-radius:6px;white-space:nowrap}
#view{position:relative;height:810px;overflow:hidden;background:#fff}
#pan{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
#mark{position:absolute;background:#FFE66D;mix-blend-mode:multiply;border-radius:5px;transform-origin:0 50%}
#peek{left:1320px;width:640px;height:640px}
#fact{right:70px;top:250px;width:900px;text-align:center;transform-origin:50% 45%}
#factbig{font-size:236px;line-height:1;color:#FFE66D;text-shadow:0 10px 0 #05060d,0 0 60px rgba(255,230,109,.35);white-space:nowrap}
#factsmall{font-family:"Elite";font-size:40px;margin-top:22px;color:#fff;text-shadow:0 3px 0 #05060d}
#fact.bubble #factbig{display:inline-block;font-size:86px;color:#17171b;background:#fff;text-shadow:none;padding:40px 54px 30px;border-radius:44px 44px 44px 8px;box-shadow:0 14px 0 rgba(5,6,13,.6);white-space:normal;line-height:1.08}
#fact.stamp #factbig{display:inline-block;font-size:100px;color:#ff4654;text-shadow:none;border:12px solid #ff4654;border-radius:18px;padding:26px 40px 10px;letter-spacing:.04em;background:rgba(5,6,13,.35)}
#factchart{position:absolute;left:40px;top:-40px;width:820px;height:420px;z-index:-1;overflow:visible}
#meme{right:60px;top:150px;width:900px;height:770px;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
.chat{width:800px;background:#11152e;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.14);font-family:"Elite"}
.chat .bar{background:#1c2250;padding:18px 26px 12px;font-family:"Anton";letter-spacing:.1em;font-size:26px;color:#bfe9ff;display:flex;gap:12px;align-items:center}
.chat .bar i{width:14px;height:14px;border-radius:50%;background:#28c840;margin-bottom:6px}
.chat .body{padding:34px 30px 40px;display:flex;flex-direction:column;gap:26px;height:360px}
.chat .u{align-self:flex-end;background:#3557ff;font-size:46px;padding:22px 28px 12px;border-radius:26px 26px 6px 26px;transform-origin:100% 100%}
.chat .b{align-self:flex-start;background:#fff;color:#17171b;font-family:"Anton";font-size:62px;padding:22px 30px 12px;border-radius:26px 26px 26px 6px;transform-origin:0 100%}
.chat .dots{align-self:flex-start;background:#fff;color:#17171b;font-family:"Anton";font-size:54px;padding:0 26px 12px;border-radius:26px 26px 26px 6px;letter-spacing:.14em}
.vs{width:820px;display:grid;grid-template-columns:330px 1fr;grid-auto-rows:330px;gap:8px;background:#05060d;border:8px solid #05060d;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vs .p{background:radial-gradient(circle at 40% 40%,#6FD6FF,#1F96E8 70%,#0C57A0);overflow:hidden}
.vs .t{background:#fff;color:#17171b;font-size:52px;line-height:1.06;display:flex;align-items:center;padding:8px 30px 0;text-transform:uppercase}
.list{width:780px;background:#f3efe4;color:#17171b;border-radius:10px;padding:36px 44px 30px;transform:rotate(-2deg);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.list h3{font-weight:400;font-size:58px;letter-spacing:.03em;border-bottom:6px solid #17171b;margin-bottom:16px}
.list div{font-family:"Elite";font-size:44px;line-height:1.55;display:flex;gap:18px;align-items:baseline}
.list div b{color:#1f9d55;font-family:"Anton";font-weight:400;font-size:46px}
.rc{position:relative;width:600px;background:#fbfaf4;color:#17171b;font-family:"VT";font-size:42px;line-height:1.12;padding:36px 36px 46px;transform:rotate(3deg);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.rc h3{font-family:"Anton";font-weight:400;font-size:54px;letter-spacing:.12em;text-align:center}
.rc p{display:flex;justify-content:space-between;gap:20px}.rc .c{justify-content:center;text-align:center}
.rc hr{border:0;border-top:4px dashed #17171b;margin:14px 0}
.rc .tot{font-size:58px}
#chip{left:56px;top:48px;display:flex;flex-direction:column;gap:10px;transform-origin:0 0}
#chip div{display:flex;align-items:stretch;font-size:44px;line-height:1;letter-spacing:.04em}
#chipn{background:#FFE66D;color:#05060d;padding:12px 16px 6px;border-radius:8px 0 0 8px}
#chipt{background:rgba(5,6,13,.82);padding:12px 20px 6px;border-radius:0 8px 8px 0}
#chips{font-family:"Elite";font-size:24px;color:#dfe6ff;background:rgba(5,6,13,.7);padding:7px 12px 3px;border-radius:6px;align-self:flex-start}
#brand{right:56px;top:52px;text-align:right;font-size:30px;letter-spacing:.12em;text-shadow:0 2px 0 rgba(5,6,13,.8)}
#brand i{font-style:normal;color:#ff4fa3}#brand span{display:block;font-family:"Elite";font-size:22px;color:#dfe6ff;margin-top:4px}
#lbT,#lbB{left:0;right:0;background:#000}#lbT{top:0}#lbB{bottom:0}
#cap{left:0;right:0;bottom:40px;text-align:center;font-size:62px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
#cap b{display:inline-block;font-weight:400;background:rgba(5,6,13,.84);padding:12px 22px 2px;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
#cap span{display:inline-block;margin:0 .13em;transform-origin:50% 80%}#cap span[dir]{margin:0}
#cap .off{color:#c9d0ee;opacity:.55}#cap .now{color:#FFE66D}
#vig{inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%);pointer-events:none}
#flash{inset:0;background:#fff}
/* A theme (boards.js THEMES, chosen by the storyboard's "theme") sets the variables below on #frame and adds the class "themed";
   without one none of these rules apply and the set is as it always was. */
#frame.themed{background:var(--bg)}
#frame.themed #insert{background:var(--insert)}
#frame.themed #grid{background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px)}
#frame.themed #w0 stop:nth-child(1){stop-color:var(--wall0)}#frame.themed #w0 stop:nth-child(2){stop-color:var(--wall1)}#frame.themed #w0 stop:nth-child(3){stop-color:var(--wall2)}
#frame.themed #wall>ellipse{opacity:var(--glow)}
#frame.themed #d0 stop:nth-child(1){stop-color:var(--desk0)}#frame.themed #d0 stop:nth-child(2){stop-color:var(--desk1)}
#frame.themed #d1 stop:nth-child(1){stop-color:var(--front0)}#frame.themed #d1 stop:nth-child(2){stop-color:var(--front1)}#frame.themed #d1 stop:nth-child(3){stop-color:var(--front2)}
#frame.themed #desklogo{fill:var(--logo)}#frame.themed #desktag{fill:var(--tag)}#frame.themed #wall rect[fill="#2c3268"]{fill:var(--shelf)}
#frame.themed #pipdesk{background:var(--pipdesk)}
#frame.themed #chipt,#frame.themed #chipi{background:var(--chipBg);color:var(--chipInk)}#frame.themed #chips{background:var(--chipBg);color:var(--chipSub)}
#frame.themed #brand{color:var(--brand);text-shadow:var(--brandShadow)}#frame.themed #brand span{color:var(--brandSub)}
#frame.themed #vig{background:var(--vig)}
/* the chip's picture, when a story names an icon */
#chipi{display:none;background:rgba(5,6,13,.82);padding:0 2px 0 12px;align-items:center}#chipi svg{display:block}

   <g class="seat"><!-- microphone -->

   <g transform="rotate(24 334 566)"><rect x="312" y="524" width="44" height="84" rx="22" fill="#11132a"/><rect x="312" y="524" width="44" height="50" rx="22" fill="#3b4070"/><path d="M316 548h36M316 560h36M318 536h32" stroke="#11132a" stroke-width="3"/><rect x="318" y="530" width="8" height="34" rx="4" fill="#fff" opacity=".25"/></g>

   <!-- nameplate -->

   <path d="M68 66l-8 16M122 66l8 16" stroke="#11132a" stroke-width="5" stroke-linecap="round"/>

 </div>
 <div id="scrim"></div>

  <div id="win"><div id="winbar"><i></i><i></i><i></i><div id="url"></div><div id="srcchip"></div></div>

 </div>
 <div id="board"></div>
 <div id="peek"></div>
 <div id="pip"></div><div id="pipdesk"></div>
 <div id="fact"><svg id="factchart" viewBox="0 0 820 420"><path id="fcline" fill="none" stroke="#ff4654" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><path id="fchead" fill="#ff4654" opacity=".85"/></svg><div id="factbig"></div><div id="factsmall"></div></div>
 <div id="meme"></div>
 <div id="lbT"></div><div id="lbB"></div>
 <div id="chip"><div><span id="chipn"></span><span id="chipi"></span><span id="chipt"></span></div><span id="chips"></span></div>
 <div id="brand"><b id="brandname" style="font-weight:400">TECH<i>FOR</i>BADGUYS</b><span id="branddate"></span></div>
 <div id="cap"></div>
 <div id="vig"></div><div id="flash"></div>
</div>
<script type="module">
import { peek3d } from "/characters/peek3d.js";
import { board, icon, useTheme } from "/boards.js";
import { EMOTES, GESTURES } from "/characters/acting.js";
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
let cfg = { slides: {}, face: "pear" }; const tvImg = {}, viewImg = {};
const show = (el, on, as = "block") => { el.style.display = on ? as : "none"; };

window.setup = async (config) => {
  cfg = config; $("frame").classList.toggle("rtl", !!config.rtl); const seated = ["solo", "short", "explain"].includes(config.layout);
  $("frame").classList.toggle("solo", seated); $("frame").classList.toggle("short", config.layout === "short"); $("frame").classList.toggle("explain", config.layout === "explain"); document.documentElement.classList.toggle("short", config.layout === "short");
  if (seated) for (const el of document.querySelectorAll("#desk .seat")) el.setAttribute("transform", "translate(400 0)"); for (const id of ["cap", "meme"]) $(id).dir = config.rtl ? "rtl" : "ltr";
  if (config.brand) {            // the channel name in three parts (the middle one in pink) and a line under it; works in Latin or Arabic
    const { a = "", b = "", c = "", tagline = "" } = config.brand, arabic = /[\u0621-\u064A]/.test(a + b + c), sp = arabic ? " " : "";
    $("desklogo").innerHTML = `${esc(a)} <tspan fill="#ff4fa3">${esc(b)}</tspan> ${esc(c)}`; $("desktag").textContent = tagline;
    $("brandname").innerHTML = `${esc(a)}${sp}<i>${esc(b)}</i>${sp}${esc(c)}`;
    if (arabic) { for (const id of ["desklogo", "desktag"]) $(id).setAttribute("letter-spacing", "0"); $("desktag").setAttribute("font-size", "30"); $("brand").style.letterSpacing = "0"; $("brandname").style.fontSize = "38px"; }
  }
  if (config.theme) {           // a theme from boards.js: its palette for the boards and icons, its studio variables for the set
    const th = useTheme(config.theme); $("frame").classList.add("themed");
    for (const [k, v] of Object.entries(th.studio || {})) $("frame").style.setProperty("--" + k, v);
  }
  $("tvdate").textContent = config.date || ""; $("branddate").textContent = config.date || "";
  const jobs = [];
  for (const [name, s] of Object.entries(config.slides)) {
    if (!s.file) continue;
    for (const [store, parent, before] of [[tvImg, $("tv"), $("tvglare")], [viewImg, $("pan"), $("mark")]]) {
      const img = new Image(); img.src = "/ep/slides/" + s.file; parent.insertBefore(img, before); store[name] = img; jobs.push(img.decode());
    }
  }
  await Promise.all(jobs);
  await Promise.all(['64px "Anton"', '24px "Elite"', '60px "Serif"', '40px "VT"'].flatMap((f) => [document.fonts.load(f), document.fonts.load(f, "عربي")])); await document.fonts.ready;
};

// One of the three places the host can appear. Each copy gets its own gradient ids.
function person(el, h, size, tag) {
  if (!h) { if (el.dataset.on !== "0") { el.innerHTML = ""; el.dataset.on = "0"; } return; }
  el.dataset.on = "1";
  const svg = peek3d(h.e, { face: cfg.face, paper: h.paper, paperShift: h.shift, bob: h.bob, tilt: h.tilt, bg: false, grain: false, size,
    armL: h.armL, armR: h.armR, shrug: h.shrug, sway: h.sway, bounce: h.bounce, squash: h.squash, roll: false });
  el.innerHTML = tag ? svg.replaceAll("p3" + cfg.face, tag + cfg.face) : svg;
}
function card(el, s) { el.querySelector(".who").textContent = s.source.toUpperCase(); el.querySelector(".what").textContent = s.text; el.querySelector(".when").textContent = "Reported " + s.date; }
function slide(store, cardEl, name) {
  for (const [k, img] of Object.entries(store)) show(img, k === name);
  const s = cfg.slides[name], text = s && !s.file;
  show(cardEl, text, "flex"); if (text) card(cardEl, s);
}

// Memes are our own drawings: a chat window, a two-panel verdict starring the host, a checklist, a receipt.
// Each is a pure function of its age in seconds, so a frame can be drawn on its own.
const pop = (a) => a < 0 ? 0 : 1 + 0.35 * Math.exp(-a * 16) * Math.cos(a * 22);
const poseCache = {};
function pose(emote, gesture, tag) {
  const key = emote + gesture + tag; if (poseCache[key]) return poseCache[key];
  const em = EMOTES[emote], g = GESTURES[gesture], side = (a) => a ? { ...a, front: false } : null;
  const svg = peek3d({ lid: 0.14, look: 0, lookY: 0, browL: 0, browR: 0, browTilt: 0, eyeScale: 1, pupil: 1, squint: 0, antL: em.ant || 0, antR: em.ant || 0, ...em, m: em.mouth, symbol: null }, { face: cfg.face, bg: false, grain: false, size: 330, viewBox: "170 30 860 860", armL: side(g.armL), armR: side(g.armR), shrug: g.shrug || 0, tilt: em.tilt || 0, roll: false });
  return (poseCache[key] = svg.replaceAll("p3" + cfg.face, tag + cfg.face));
}
const MEMES = {
  chat: (d, a) => `<div class="chat"><div class="bar"><i></i>${esc(d.title || "AI ASSISTANT")}</div><div class="body">
    <div class="u" style="transform:scale(${pop(a)})">${esc(d.user)}</div>
    ${a >= d.delay ? `<div class="b" style="transform:scale(${pop(a - d.delay)})">${esc(d.bot)}</div>` : a > 0.22 ? `<div class="dots">${"•".repeat(1 + Math.floor((a - 0.22) / 0.12) % 3)}</div>` : ""}</div></div>`,
  versus: (d, a) => `<div class="vs"><div class="p">${pose("angry", "stop", "v1")}</div><div class="t">${esc(d.no)}</div>
    ${a >= d.delay ? `<div class="p">${pose("grin", "cheer", "v2")}</div><div class="t">${esc(d.yes)}</div>` : `<div class="p" style="background:#11152e"></div><div class="t" style="background:#11152e"></div>`}</div>`,
  list: (d, a) => `<div class="list"><h3>${esc(d.title)}</h3>${d.items.map((x, i) => a >= 0.2 + i * d.step ? `<div><b>✓</b>${esc(x)}</div>` : `<div style="visibility:hidden"><b>✓</b>${esc(x)}</div>`).join("")}</div>`,
  receipt: (d, a) => `<div style="clip-path:inset(0 -80px ${Math.max(0, 1 - a / 0.7) * 100}% -80px);transform:translateY(${Math.max(0, 1 - a / 0.7) * -120}px)"><div class="rc"><h3>${esc(d.title)}</h3><p class="c">${esc(d.sub || "")}</p><hr>
    ${d.items.map(([k, v]) => `<p><span>${esc(k)}</span><span>${esc(v)}</span></p>`).join("")}<hr><p class="tot"><span>${esc(d.totalLabel || "TOTAL")}</span><span>${esc(d.total)}</span></p><hr><p class="c">${esc(d.foot || "")}</p></div></div>`,
};
let lastMeme = "";

window.draw = (st) => {
  const studio = !st.insert || st.insert.enter < 1;
  show($("world"), studio); show($("scrim"), st.scrim > 0.01); $("scrim").style.opacity = st.scrim;
  if (studio) {
    const c = st.cam;
    // vertical frame: the host is larger and centred when he is alone, smaller and lower when something sits above him
    const tall = cfg.layout === "short", room = st.room || 0, zoom = tall ? c.s * (1.25 - 0.25 * room) : c.s, ax = tall ? 540 : 960, ay = tall ? 1280 + 274 * room : 540;
    if (tall) $("cap").style.top = 1470 - 565 * room + "px";
    $("world").style.transform = `translate(${ax - c.x * zoom}px,${ay - c.y * zoom}px) scale(${zoom}) rotate(${c.r || 0}deg)`;
    $("world").style.filter = st.blur > 0.5 ? `blur(${st.blur.toFixed(1)}px)` : "";
    person($("host"), st.host, 900); if (st.host) $("host").style.transform = `translateY(${st.host.y}px)`;
    person($("lurk"), st.lurk, 340, "q3"); if (st.lurk) $("lurk").style.top = 185 - 162 * st.lurk.amt + "px";
    slide(tvImg, $("tvcard"), st.tv); show($("tvident"), !st.tv, "flex");
    $("onair").style.opacity = st.onair; if (st.sweep !== undefined) $("sweep").setAttribute("transform", `rotate(${st.sweep})`);
    show($("drone"), !!st.drone);
    if (st.drone) { $("drone").style.transform = `translate(${st.drone.x}px,${st.drone.y}px) rotate(${st.drone.r}deg)`; $("led").style.opacity = st.drone.led; $("rotA").setAttribute("rx", st.drone.spin); $("rotB").setAttribute("rx", st.drone.spin);
      const b = st.drone.batt; $("battfill").setAttribute("width", Math.max(0, 38 * b)); $("battfill").setAttribute("fill", b > 0.5 ? "#58d68d" : b > 0.2 ? "#FFE66D" : "#ff4654"); $("batt").style.opacity = b < 0.2 && Math.floor(st.drone.blink) % 2 ? 0.3 : 1; }
  }
  const ins = st.insert; show($("insert"), !!ins);
  if (ins) {
    const s = cfg.slides[ins.slide] || {}, solo = cfg.layout === "solo" || cfg.layout === "explain";
    show($("win"), !!ins.slide); slide(viewImg, $("viewcard"), ins.slide);
    if (ins.slide) { $("url").textContent = s.url.replace(/^https?:\/\/(www\.)?/, ""); $("srcchip").textContent = `${s.source} · ${s.date}`.toUpperCase(); }
    $("insert").style.opacity = Math.min(1, ins.enter * 3);
    $("insert").style.filter = st.blur > 0.5 ? `blur(${st.blur.toFixed(1)}px)` : "";
    $("win").style.transform = `translate(${ins.dx}px,${ins.dy}px) rotate(${ins.rot}deg) scale(${ins.scale})`;
    $("grid").style.transform = `translate(${-ins.drift * 40}px,${-ins.drift * 24}px)`;
    const W = solo ? 1920 : 1440, H = solo ? 1080 : 810, tall = s.screens || 1;              // the picture may be several screens tall; cy counts screens
    const tx = Math.min(0, Math.max(-(ins.k - 1) * W, 0.5 * W - ins.k * ins.cx * W)), ty = Math.min(0, Math.max(H - ins.k * tall * H, 0.44 * H - ins.k * ins.cy * H));
    $("pan").style.transform = `translate(${tx}px,${ty}px) scale(${ins.k})`;
    const m = ins.mark; show($("mark"), !!m && m.p > 0);
    if (m) Object.assign($("mark").style, { left: m.x * W + "px", top: m.y * H + "px", width: m.w * W + "px", height: m.h * H + "px", transform: `scaleX(${m.p})` });
  }
  person($("pip"), st.pip, 600, "s3"); show($("pipdesk"), !!st.pip);
  if (st.pip) { const d = (1 - st.pip.amt) * 470; $("pip").style.transform = `translateY(${d + st.pip.y * 0.66}px)`; $("pipdesk").style.transform = `translateY(${d}px)`; }
  const bd = st.board; show($("board"), !!bd); if (bd) $("board").innerHTML = board(bd.spec, bd.step, bd.age, bd.total, cfg);
  person($("peek"), st.peek, 640, "r3");
  if (st.peek && st.peek.side) { const right = st.peek.side === "right", a = st.peek.amt;       // leaning in from the edge of the frame
    $("peek").style.top = "520px"; $("peek").style.left = (right ? 1920 - 430 * a : -640 + 430 * a) + "px"; $("peek").style.transform = `rotate(${right ? -15 : 15}deg)`; }
  else if (st.peek) { $("peek").style.left = "1320px"; $("peek").style.top = 1080 - st.peek.amt * st.peek.rise + "px"; $("peek").style.transform = `rotate(${st.peek.rot}deg)`; }
  const f = st.fact; show($("fact"), !!f);
  if (f) { $("fact").className = f.tone || ""; $("factbig").textContent = f.big; $("factsmall").textContent = f.small || ""; $("factsmall").style.opacity = f.sub;
    show($("factchart"), f.chart === "down");
    if (f.chart === "down") { const pts = [[0, 60], [110, 40], [200, 90], [300, 70], [400, 150], [500, 130], [600, 260], [700, 250], [800, 400]], n = Math.max(2, Math.ceil(Math.min(1, f.age / 0.5) * pts.length)), seen = pts.slice(0, n), [ex, ey] = seen[n - 1];
      $("fcline").setAttribute("d", "M" + seen.map((q) => q.join(" ")).join("L")); $("fchead").setAttribute("d", n === pts.length ? `M${ex + 22} ${ey + 30}l-52 -14l34 -34z` : ""); }
    $("fact").style.transform = `translate(${f.dx}px,${f.dy}px) rotate(${f.rot}deg) scale(${f.s})`; $("fact").style.opacity = f.a; }
  const me = st.meme; show($("meme"), !!me, "flex");
  if (me) { const html = MEMES[me.kind](me, me.age); if (html !== lastMeme) { $("meme").innerHTML = html; lastMeme = html; } $("meme").style.transform = `rotate(${me.rot}deg) scale(${me.s})`; $("meme").style.opacity = me.a; }
  else if (lastMeme) { $("meme").innerHTML = ""; lastMeme = ""; }
  $("lbT").style.height = $("lbB").style.height = st.lb + "px";
  const ch = st.chip; show($("chip"), !!ch, "flex");
  if (ch) { if ((ch.icon || "") !== $("chipi").dataset.icon) { $("chipi").dataset.icon = ch.icon || ""; $("chipi").innerHTML = ch.icon ? `<svg viewBox="-115 -115 230 230" width="50" height="50">${icon(ch.icon)}</svg>` : ""; show($("chipi"), !!ch.icon, "flex"); }
    $("chipn").textContent = String(ch.n).padStart(2, "0"); $("chipt").textContent = ch.tag; $("chips").textContent = ch.src || ""; show($("chips"), !!ch.src); $("chip").style.opacity = ch.a; $("chip").style.transform = `translate(${(1 - ch.a) * -40}px,${st.lb}px) scale(${ch.pop})`;
    $("chip").style.top = ch.low ? "auto" : cfg.layout === "short" ? "150px" : "48px"; $("chip").style.bottom = ch.low ? "40px" : "auto"; $("chip").style.transformOrigin = ch.low ? "0 100%" : "0 0"; }
  $("brand").style.opacity = st.brand; $("brand").style.transform = `translateY(${st.lb}px)`;
  // In a right-to-left caption, neighbouring Latin words (a person's name) are kept together left to right.
  const said = st.words.filter((w) => w.t), latin = (w) => cfg.rtl && /[A-Za-z]/.test(w.t) && !/[\u0621-\u064A]/.test(w.t);
  let html = "";
  for (let i = 0; i < said.length; i++) { const w = said[i], one = `<span class="${w.state}" style="transform:scale(${w.scale})">${esc(w.t)}</span>`;
    if (latin(w) && !(i && latin(said[i - 1]))) html += '<span dir="ltr">';
    html += one; if (latin(w) && !(i + 1 < said.length && latin(said[i + 1]))) html += "</span>"; }
  $("cap").innerHTML = said.length ? "<b>" + html + "</b>" : "";
  $("flash").style.opacity = st.flash; show($("flash"), st.flash > 0.004);
};
window.__ready = true;
</script></body></html>
