<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{background:#000}
.card{width:1200px;height:1200px;position:relative;overflow:hidden;font-family:"JetBrains Mono",monospace;background:#0C57A0;color:#fff;display:grid;grid-template-columns:repeat(4,300px);grid-template-rows:repeat(3,400px)}
.cell{position:relative;width:300px;height:400px;overflow:hidden}
.cell svg{display:block;margin-top:50px}
.tag{position:absolute;left:12px;top:10px;font-size:20px;font-weight:800;letter-spacing:.1em}
.sub{position:absolute;left:12px;top:36px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#BFE9FF}
</style></head><body><div id="root"></div>
<script type="module">
import { peek3d, MOUTHS } from "/characters/peek3d.js";
// Kept in step with VISEME in lipsync.cjs.
const V = [["REST", "idle smirk", MOUTHS.smirk], ["DEADPAN", "flat", MOUTHS.flat],
  ["M B P", "lips together", { w: 0.8, smile: 0.1, jaw: 0 }], ["F V", "teeth on lip", { w: 0.76, smile: 0.14, jaw: 0.1 }],
  ["C", "t d s k n ...", { w: 0.84, smile: 0.18, jaw: 0.22 }], ["L TH", "tongue up", { w: 0.8, smile: 0.16, jaw: 0.46, tongue: 1 }],
  ["E", "eh ih ee", { w: 0.98, smile: 0.22, jaw: 0.5 }], ["A", "ah ae", { w: 0.82, smile: 0.16, jaw: 1 }],
  ["O", "oh aw", { w: 0.6, smile: 0.06, jaw: 0.85 }], ["U W", "oo w", { w: 0.46, smile: 0.04, jaw: 0.36 }],
  ["R", "er r", { w: 0.62, smile: 0.08, jaw: 0.34 }], ["A loud", "jaw 1.1", { w: 0.82, smile: 0.16, jaw: 1.1 }]];
const d = document.createElement("div"); d.className = "card"; d.id = "card-visemes";
d.innerHTML = V.map(([n, sub, m]) => `<div class="cell">${peek3d({ lid: 0.14, look: 0, m: { smirk: 0.35, tongue: 0, ...m } }, { face: "pear", size: 300, viewBox: "380 250 440 440", bg: true, grain: false })}<div class="tag">${n}</div><div class="sub">${sub}</div></div>`).join("");
document.getElementById("root").appendChild(d);
await document.fonts.ready; window.__ready = true;
</script></body></html>
