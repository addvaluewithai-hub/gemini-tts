<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Anton";src:url("/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Cairo";font-weight:900;src:url("/node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Cairo";font-weight:900;src:url("/node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2") format("woff2")}
html,body{margin:0;background:#000}
#s{display:block;width:1080px;height:1920px}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script type="module">
const mod = new URLSearchParams(location.search).get("m") || "bleach";
const { frame, setup } = await import(`/shorts-v2a/${mod}.js`);
if (setup) await setup(await (await fetch("/data.json")).json());
const s = document.getElementById("s");
window.draw = (t) => { s.innerHTML = frame(t); };
await document.fonts.load('120px "Anton"'); await document.fonts.load('900 90px "Cairo"', "الكلور"); await document.fonts.ready; window.__ready = true;
</script></body></html>
